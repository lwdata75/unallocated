# Everything here is relative to the repository root.
#
# `base` is deliberately NOT set. The site's UI has its base directory at "/",
# and a `base` here would contradict it — which is exactly what broke every
# deploy: the build ran at the repo root, where there is no package.json, and
# failed with ENOENT before it reached Vite. Declaring the paths from the root
# means the build works whatever the UI says, and needs no setting kept in sync
# in two places.
[build]
  # `cd web` because the frontend is a subdirectory of a repo that also holds
  # the Python pipeline. `npm run assets` fetches the third-party files whose
  # licences do not permit committing them here — see NOTICE.md.
  command = "cd web && npm run assets && npm run build"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "22"

# Content-hashed by the bundler and by scripts/fetch-fonts.mjs, so these can be
# cached hard. A new build produces new filenames.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The data files are not hashed: they are re-exported by the pipeline and must
# revalidate so a fresh run is picked up.
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/tokenizers/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
