[project]
name = "token-tax-pipeline"
version = "0.1.0"
description = "Tokenizer fertility measurement across languages for The English Discount"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tiktoken>=0.8",
    "tokenizers>=0.20",
    "huggingface-hub>=0.26",
    "numpy>=2.0",
    "requests>=2.32",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "scipy>=1.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "gate: a validation gate from spec section 3.4",
]

[tool.uv]
package = false
